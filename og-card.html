<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#030515;color:#eceae4;font-family:'Outfit',sans-serif;
  position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:0 84px;
}
.glow{position:absolute;top:-180px;left:280px;width:840px;height:520px;
  background:radial-gradient(ellipse at center,rgba(212,162,58,.18),transparent 70%);pointer-events:none}
.logo{position:absolute;top:64px;left:84px;font-weight:700;font-size:30px;letter-spacing:-.01em}
.logo .dot{color:#d4a23a}
.site{position:absolute;bottom:60px;left:84px;font-family:'JetBrains Mono',monospace;
  font-size:24px;color:#56525f;letter-spacing:.04em}
h1{font-size:92px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:18px}
.role{font-size:52px;font-weight:700;color:#d4a23a;letter-spacing:-.02em;margin-bottom:26px}
.lead{font-size:30px;font-weight:300;color:#9a96a4;max-width:840px;margin-bottom:34px}
.tags{display:flex;gap:14px}
.tags span{font-family:'JetBrains Mono',monospace;font-size:21px;color:#9a96a4;
  border:1px solid rgba(212,162,58,.28);border-radius:8px;padding:8px 16px}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo">dranben<span class="dot">.</span></div>
  <h1>Branden Kennedy</h1>
  <div class="role">Full-Stack Developer</div>
  <div class="lead">I build and ship full-stack web apps end to end, in React and TypeScript on Cloudflare's edge.</div>
  <div class="tags"><span>React</span><span>TypeScript</span><span>Cloudflare Workers</span><span>D1</span><span>Node.js</span></div>
  <div class="site">dranben.com</div>
</body>
</html>
