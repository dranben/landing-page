<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#f2ead9;color:#2b2416;font-family:'Source Serif 4',Georgia,serif;
  position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:0 84px;border-top:10px solid #2e5339;
}
.logo{position:absolute;top:58px;left:84px;font-weight:700;font-size:30px}
.site{position:absolute;bottom:60px;left:84px;font-family:'JetBrains Mono',monospace;
  font-size:24px;color:#8b7f66;letter-spacing:.04em}
h1{font-size:88px;font-weight:700;letter-spacing:-.015em;line-height:1.05;margin-bottom:18px}
.role{font-size:50px;font-weight:600;color:#2e5339;letter-spacing:-.01em;margin-bottom:26px}
.lead{font-size:30px;color:#5a5240;max-width:840px;margin-bottom:34px}
.tags{display:flex;gap:14px}
.tags span{font-family:'JetBrains Mono',monospace;font-size:21px;color:#6f5638;
  border:1px solid rgba(75,60,35,.28);border-radius:4px;padding:8px 16px}
</style>
</head>
<body>
  <div class="logo">dranben.</div>
  <h1>Branden Kennedy</h1>
  <div class="role">Full-Stack Developer</div>
  <div class="lead">I build and ship full-stack web apps end to end, in React and TypeScript on Cloudflare's edge.</div>
  <div class="tags"><span>React</span><span>TypeScript</span><span>Cloudflare Workers</span><span>D1</span><span>Node.js</span></div>
  <div class="site">dranben.com</div>
</body>
</html>
